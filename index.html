<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Domácí rozpočet</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #121212;
    --card: #1e1e1e;
    --field: #161616;
    --gold: #d4af37;
    --gold-hover: #f3e5ab;
    --text: #e0e0e0;
    --muted: #a0a0a0;
    --faint: #6b6b6b;
    --border: #333333;
    --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 32px 18px 80px; }

  header { text-align: center; padding-bottom: 22px; margin-bottom: 26px; border-bottom: 1px solid var(--border); }
  header h1 {
    margin: 0; font-family: var(--serif); font-weight: 500; font-size: 2.1rem;
    letter-spacing: 0.01em; color: var(--text);
  }
  header h1 em { color: var(--gold); font-style: italic; }
  #today { margin: 6px 0 0; color: var(--muted); font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase; }

  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 22px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  }
  .card-title {
    margin: 0 0 18px; font-family: var(--serif); font-size: 1.45rem; font-weight: 500;
    color: var(--text);
  }
  .card-title em { color: var(--gold); font-style: italic; }

  .label {
    display: block; font-size: 0.75rem; font-weight: 600; color: var(--gold);
    text-transform: uppercase; letter-spacing: 1px; margin: 0 0 8px;
  }
  .field { margin-top: 18px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* Účty */
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .seg button {
    background: var(--field); border: 1px solid var(--border); color: var(--muted);
    padding: 11px 0; border-radius: 8px; font: inherit; font-weight: 700; cursor: pointer;
    transition: 0.2s;
  }
  .seg button:hover { border-color: var(--gold); color: var(--text); }
  .seg button.active { background: var(--gold); border-color: var(--gold); color: #000; }

  /* Kategorie */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    background: var(--field); border: 1px solid var(--border); color: var(--text);
    padding: 7px 13px; border-radius: 8px; font: inherit; font-size: 14px; cursor: pointer; transition: 0.2s;
  }
  .chip:hover { border-color: var(--gold); }
  .chip.active { background: var(--gold); border-color: var(--gold); color: #000; font-weight: 600; }
  .hint { color: var(--faint); font-size: 14px; font-style: italic; }

  /* Vstupy */
  input[type="text"], input[type="password"], .amount-box {
    width: 100%; background: var(--field); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font: inherit; font-size: 15px; padding: 12px 14px; outline: none; transition: 0.2s;
  }
  input[type="text"]:focus, input[type="password"]:focus, .amount-box:focus-within { border-color: var(--gold); }
  input::placeholder { color: var(--faint); }

  .amount-box { display: flex; align-items: center; padding: 6px 14px; }
  .amount-box input {
    flex: 1; min-width: 0; background: transparent; border: 0; color: var(--text);
    font-family: var(--serif); font-size: 2rem; padding: 6px 0; outline: none;
  }
  .amount-box span { color: var(--gold); font-weight: 700; font-size: 0.95rem; }

  button.submit {
    width: 100%; margin-top: 22px; padding: 14px; border: 0; border-radius: 8px;
    background: var(--gold); color: #000; font: inherit; font-weight: 700; font-size: 0.9rem;
    text-transform: uppercase; letter-spacing: 1.5px; cursor: pointer; transition: 0.2s;
  }
  button.submit:hover { background: var(--gold-hover); }
  button.submit:disabled { opacity: 0.5; cursor: default; }

  /* Přehled */
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
  .stat { background: var(--field); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
  .stat-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .stat-value { font-family: var(--serif); font-size: 1.7rem; color: var(--text); font-variant-numeric: tabular-nums; }
  .stat-value.gold { color: var(--gold); }

  .chart-box { position: relative; height: 210px; margin-bottom: 18px; }
  .legend { display: grid; gap: 6px; }
  .legend-item {
    display: flex; align-items: center; padding: 11px 12px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--field); font-size: 14px;
  }
  .legend-item .dot { width: 9px; height: 9px; border-radius: 50%; margin-right: 12px; flex-shrink: 0; }
  .legend-item .name { flex: 1; }
  .legend-item .val { font-weight: 700; color: var(--gold); font-variant-numeric: tabular-nums; }
  .empty { color: var(--faint); font-size: 14px; font-style: italic; text-align: center; padding: 14px 0; }
  .counter { margin-top: 16px; text-align: center; color: var(--faint); font-size: 0.72rem; letter-spacing: 0.04em; line-height: 1.7; }

  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 120px);
    background: var(--gold); color: #000; padding: 12px 20px; border-radius: 8px;
    font-size: 14px; font-weight: 700; opacity: 0; transition: 0.3s; pointer-events: none;
  }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Domácí <em>rozpočet</em></h1>
    <p id="today"></p>
  </header>

  <form id="expenseForm" class="card">
    <h2 class="card-title">Nový <em>výdaj</em></h2>

    <span class="label">Účet</span>
    <div class="seg" id="accounts">
      <button type="button" data-acc="Společný">Společný</button>
      <button type="button" data-acc="Pavel">Pavel</button>
      <button type="button" data-acc="Gabi">Gabi</button>
    </div>

    <div class="field">
      <span class="label">Kategorie</span>
      <div class="chips" id="categoryChips"></div>
    </div>

    <div class="field">
      <span class="label">Podkategorie</span>
      <div class="chips" id="subChips"><span class="hint">Nejdřív vyber kategorii</span></div>
    </div>

    <div class="field">
      <span class="label">Částka</span>
      <div class="amount-box">
        <input type="number" id="amount" placeholder="0" required step="any" inputmode="decimal">
        <span>Kč</span>
      </div>
    </div>

    <div class="field row">
      <div>
        <span class="label">Poznámka</span>
        <input type="text" id="note" placeholder="Kaufland, nafta…">
      </div>
      <div>
        <span class="label">PIN</span>
        <input type="password" id="pinCode" placeholder="••••" required inputmode="numeric">
      </div>
    </div>

    <button type="submit" class="submit" id="submitBtn">Odeslat výdaj</button>
  </form>

  <section class="card">
    <h2 class="card-title">Tento <em>měsíc</em></h2>
    <div class="stats">
      <div class="stat">
        <div class="stat-label">Celkem</div>
        <div class="stat-value gold" id="monthTotal">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">Položek</div>
        <div class="stat-value" id="itemCount">—</div>
      </div>
    </div>
    <div class="chart-box"><canvas id="chart"></canvas></div>
    <div class="legend" id="legend"></div>
    <div class="counter" id="counter"></div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
  const CATEGORIES = {
    "Jídlo": ["Obchod", "Restaurace", "Kavárna", "Hospoda", "Dovoz"],
    "Drogerie": ["Kosmetika", "Čištění", "Praní"],
    "Kočky": ["Krmivo", "Toaleta", "Veterina"],
    "Doprava": ["Palivo", "Servis", "Dálnice", "Pojištění", "Mytí"],
    "Domácnost": ["Rostliny", "Dekorace", "Nádobí", "Textílie", "Terasa", "Servis"],
    "Zdraví": ["Doktor", "Zubař", "Lékárna", "Vitamíny"],
    "Volný čas": ["Sport", "Klavír", "Výlety", "Dovolená"],
    "Ostatní": ["Elektronika", "Oblečení", "Dárky", "Investice (XTB)", "Jiné"]
  };
  // Zlatá a tlumené odstíny, ať graf ladí s webem
  const COLORS = ["#d4af37", "#f3e5ab", "#a0a0a0", "#9c7d1b", "#80640e", "#6b6b6b", "#c9a227", "#4a4a4a"];
  const COLOR_BY_CAT = {};
  Object.keys(CATEGORIES).forEach((c, i) => COLOR_BY_CAT[c] = COLORS[i % COLORS.length]);

  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwUWMPw8rI3W8TL2nxPD4ue4blpo5dwmTb_5Wjh-n7UGRWJqYrvqu-z2RUqIb-iR5gs/exec";

  const state = { account: "", category: "", subcategory: "" };
  let chart = null;

  const $ = id => document.getElementById(id);
  const fmt = n => Math.round(n).toLocaleString("cs-CZ") + " Kč";

  $("today").textContent = new Date().toLocaleDateString("cs-CZ", { day: "numeric", month: "long", year: "numeric" });

  // Výběr účtu
  document.querySelectorAll("#accounts button").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("#accounts button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      state.account = btn.dataset.acc;
    });
  });

  // Kategorie
  Object.keys(CATEGORIES).forEach(cat => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip";
    b.textContent = cat;
    b.addEventListener("click", () => {
      document.querySelectorAll("#categoryChips .chip").forEach(c => c.classList.remove("active"));
      b.classList.add("active");
      state.category = cat;
      state.subcategory = "";
      renderSubs(cat);
    });
    $("categoryChips").appendChild(b);
  });

  function renderSubs(cat) {
    const wrap = $("subChips");
    wrap.innerHTML = "";
    CATEGORIES[cat].forEach(sub => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      b.textContent = sub;
      b.addEventListener("click", () => {
        wrap.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
        b.classList.add("active");
        state.subcategory = sub;
      });
      wrap.appendChild(b);
    });
  }

  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2200);
  }

  // Odeslání výdaje
  const submitBtn = $("submitBtn");
  $("expenseForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!state.account) { toast("Vyber účet: Společný, Pavel nebo Gabi"); return; }
    if (!state.category || !state.subcategory) { toast("Vyber kategorii a podkategorii"); return; }
    const amount = $("amount").value;
    const pin = $("pinCode").value;
    if (!amount || !pin) { toast("Vyplň částku a PIN"); return; }

    submitBtn.disabled = true;
    submitBtn.textContent = "Odesílám…";

    const payload = {
      account: state.account,
      category: state.category,
      subcategory: state.subcategory,
      amount: amount,
      note: $("note").value,
      pin: pin,
      device: navigator.userAgent.slice(0, 200)
    };

    try {
      // no-cors: odpověď nelze přečíst, ověříme to přehledem níž
      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(payload)
      });
      toast("Výdaj odeslán");
      $("amount").value = "";
      $("note").value = "";
      $("pinCode").value = "";
      setTimeout(loadData, 2000);
    } catch (err) {
      toast("Chyba při odesílání");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Odeslat výdaj";
    }
  });

  // Načtení dat přes JSONP
  function loadData() {
    const name = "cb_" + Date.now();
    const script = document.createElement("script");
    const timer = setTimeout(fail, 10000);

    function cleanup() {
      clearTimeout(timer);
      delete window[name];
      script.remove();
    }
    function fail() {
      cleanup();
      $("monthTotal").textContent = "—";
      $("itemCount").textContent = "—";
      $("legend").innerHTML = '<div class="empty">Data se nepodařilo načíst</div>';
    }

    window[name] = rows => {
      cleanup();
      if (!Array.isArray(rows)) return fail();
      renderFromRows(rows);
    };
    script.onerror = fail;
    script.src = SCRIPT_URL + "?callback=" + name;
    document.body.appendChild(script);
  }

  // Datum z tabulky: Date, ISO text nebo český text "6.11.2026 13:33"
  function parseDate(v) {
    if (v instanceof Date) return v;
    if (typeof v === "string") {
      const m = v.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})(?:\s+(\d{1,2}):(\d{2}))?/);
      if (m) return new Date(+m[3], +m[2] - 1, +m[1], +(m[4] || 0), +(m[5] || 0));
    }
    return new Date(v);
  }

  // Sjednotí staré názvy účtů
  function normAccount(a) {
    if (!a) return "";
    const s = String(a);
    if (s.startsWith("Společ")) return "Společný";
    if (s.startsWith("Gab")) return "Gabi";
    return s;
  }

  function renderFromRows(rows) {
    const now = new Date();
    const totals = {};
    const counts = { "Společný": 0, "Pavel": 0, "Gabi": 0 };
    let sum = 0;
    let items = 0;
    rows.forEach(r => {
      const d = parseDate(r[0]);
      if (isNaN(d) || d.getMonth() !== now.getMonth() || d.getFullYear() !== now.getFullYear()) return;
      const amt = Number(r[1]) || 0;
      const cat = r[3] || "Ostatní";
      const acc = normAccount(r[2]);
      totals[cat] = (totals[cat] || 0) + amt;
      sum += amt;
      items++;
      // Automatické trvalé platby se do počítadla nezapočítávají
      const automatic = String(r[6] || "") === "Automaticky";
      if (!automatic && counts[acc] !== undefined) counts[acc]++;
    });
    $("itemCount").textContent = items;
    renderSummary(totals, sum);
    renderCounter(counts);
  }

  function renderCounter(counts) {
    $("counter").textContent =
      "Ruční platby tento měsíc: Společný " + counts["Společný"] +
      " · Pavel " + counts["Pavel"] +
      " · Gabi " + counts["Gabi"];
  }

  function renderSummary(totals, sum) {
    $("monthTotal").textContent = fmt(sum);
    const cats = Object.keys(totals).sort((a, b) => totals[b] - totals[a]);
    const values = cats.length ? cats.map(c => totals[c]) : [1];
    const colors = cats.length ? cats.map(c => COLOR_BY_CAT[c] || "#4a4a4a") : ["#333333"];
    const labels = cats.length ? cats : ["Zatím nic"];

    if (chart) {
      chart.data.labels = labels;
      chart.data.datasets[0].data = values;
      chart.data.datasets[0].backgroundColor = colors;
      chart.update();
    } else {
      chart = new Chart($("chart"), {
        type: "doughnut",
        data: { labels, datasets: [{ data: values, backgroundColor: colors, borderWidth: 0 }] },
        options: {
          cutout: "72%",
          maintainAspectRatio: false,
          plugins: { legend: { display: false }, tooltip: { enabled: cats.length > 0 } }
        }
      });
    }

    $("legend").innerHTML = cats.length
      ? cats.map(c => `
          <div class="legend-item">
            <span class="dot" style="background:${COLOR_BY_CAT[c] || "#4a4a4a"}"></span>
            <span class="name">${c}</span>
            <span class="val">${fmt(totals[c])}</span>
          </div>`).join("")
      : '<div class="empty">Tento měsíc zatím žádné výdaje</div>';
  }

  loadData();
</script>
</body>
</html>
