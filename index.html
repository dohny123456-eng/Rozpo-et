<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Domácí rozpočet</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0c0c0e;
    --surface: #161618;
    --surface-2: #1f1f22;
    --text: #f2f2f2;
    --muted: #8e8e93;
    --faint: #56565c;
    --line: #26262a;
    --accent: #ff7a1a;
    --accent-soft: rgba(255, 122, 26, 0.14);
    --accent-ink: #0c0c0e;
    --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 460px; margin: 0 auto; padding: 28px 18px 80px; }

  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 26px; }
  header h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  #today { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .badge {
    width: 40px; height: 40px; border-radius: 12px; background: var(--surface);
    display: grid; place-items: center; color: var(--accent); font-size: 18px;
  }

  /* Účet: segmentovaný přepínač */
  .seg {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;
    background: var(--surface); border-radius: 14px; padding: 4px;
  }
  .seg button {
    background: transparent; border: 0; padding: 11px 0; border-radius: 10px;
    font: inherit; font-weight: 600; color: var(--muted); cursor: pointer; transition: 0.15s;
  }
  .seg button.active { background: var(--accent); color: var(--accent-ink); }

  .card {
    background: var(--surface); border-radius: 18px; padding: 20px; margin-bottom: 14px;
  }
  .card-title {
    font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 16px;
  }

  .label { display: block; font-size: 12px; color: var(--muted); margin: 0 0 8px; }
  .field { margin-top: 18px; }

  /* Kategorie a podkategorie */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    background: var(--surface-2); border: 1px solid transparent; color: var(--text);
    padding: 8px 14px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer;
    transition: 0.15s;
  }
  .chip:hover { border-color: var(--faint); }
  .chip.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .hint { color: var(--faint); font-size: 14px; }

  /* Částka */
  .amount-box {
    display: flex; align-items: center; background: var(--surface-2); border-radius: 14px;
    padding: 4px 16px; border: 1px solid transparent; transition: border-color 0.15s;
  }
  .amount-box:focus-within { border-color: var(--accent); }
  .amount-box input {
    flex: 1; background: transparent; border: 0; color: var(--text); font: inherit;
    font-size: 30px; font-weight: 700; padding: 10px 0; outline: none; min-width: 0;
  }
  .amount-box span { color: var(--muted); font-weight: 600; }

  input[type="text"], input[type="password"] {
    width: 100%; padding: 13px 14px; background: var(--surface-2); border: 1px solid transparent;
    border-radius: 12px; color: var(--text); font: inherit; font-size: 15px; outline: none;
    transition: border-color 0.15s;
  }
  input::placeholder { color: var(--faint); }
  input:focus { border-color: var(--accent); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  button.submit {
    width: 100%; margin-top: 18px; padding: 15px; border: 0; border-radius: 14px;
    background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 700;
    font-size: 15px; cursor: pointer; transition: opacity 0.15s;
  }
  button.submit:hover { opacity: 0.92; }
  button.submit:disabled { opacity: 0.5; cursor: default; }

  /* Přehled */
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
  .stat { background: var(--surface-2); border-radius: 14px; padding: 14px; }
  .stat-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .stat-value { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat-value.accent { color: var(--accent); }

  .chart-box { position: relative; height: 200px; margin-bottom: 18px; }
  .legend { display: grid; gap: 4px; }
  .legend-item {
    display: flex; align-items: center; padding: 12px; border-radius: 12px; background: var(--surface-2);
    font-size: 14px; margin-bottom: 6px;
  }
  .legend-item .dot { width: 8px; height: 8px; border-radius: 50%; margin-right: 12px; flex-shrink: 0; }
  .legend-item .name { flex: 1; }
  .legend-item .val { font-weight: 600; font-variant-numeric: tabular-nums; }
  .empty { color: var(--faint); font-size: 14px; text-align: center; padding: 16px 0; }
  .counter { margin-top: 14px; text-align: center; color: var(--faint); font-size: 11px; line-height: 1.6; }

  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 120px);
    background: var(--text); color: var(--bg); padding: 12px 18px; border-radius: 12px;
    font-size: 14px; font-weight: 600; opacity: 0; transition: 0.3s; pointer-events: none;
  }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Domácí rozpočet</h1>
      <p id="today"></p>
    </div>
    <div class="badge">◎</div>
  </header>

  <form id="expenseForm">
    <div class="card">
      <h2 class="card-title">Nový výdaj</h2>

      <div class="seg" id="accounts">
        <button type="button" data-acc="Společný">Společný</button>
        <button type="button" data-acc="Pavel">Pavel</button>
        <button type="button" data-acc="Gabi">Gabi</button>
      </div>

      <div class="field">
        <span class="label">Kategorie</span>
        <div class="chips" id="categoryChips"></div>
      </div>

      <div class="field">
        <span class="label">Podkategorie</span>
        <div class="chips" id="subChips"><span class="hint">Nejdřív vyber kategorii</span></div>
      </div>

      <div class="field">
        <span class="label">Částka</span>
        <div class="amount-box">
          <input type="number" id="amount" placeholder="0" required step="any" inputmode="decimal">
          <span>Kč</span>
        </div>
      </div>

      <div class="field row">
        <div>
          <span class="label">Poznámka</span>
          <input type="text" id="note" placeholder="Kaufland, nafta…">
        </div>
        <div>
          <span class="label">PIN</span>
          <input type="password" id="pinCode" placeholder="••••" required inputmode="numeric">
        </div>
      </div>

      <button type="submit" class="submit" id="submitBtn">Odeslat výdaj</button>
    </div>
  </form>

  <div class="card">
    <h2 class="card-title">Tento měsíc</h2>
    <div class="stats">
      <div class="stat">
        <div class="stat-label">Celkem</div>
        <div class="stat-value accent" id="monthTotal">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">Položek</div>
        <div class="stat-value" id="itemCount">—</div>
      </div>
    </div>
    <div class="chart-box"><canvas id="chart"></canvas></div>
    <div class="legend" id="legend"></div>
    <div class="counter" id="counter"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const CATEGORIES = {
    "Jídlo": ["Obchod", "Restaurace", "Kavárna", "Hospoda", "Dovoz"],
    "Drogerie": ["Kosmetika", "Čištění", "Praní"],
    "Kočky": ["Krmivo", "Toaleta", "Veterina"],
    "Doprava": ["Palivo", "Servis", "Dálnice", "Pojištění", "Mytí"],
    "Domácnost": ["Rostliny", "Dekorace", "Nádobí", "Textílie", "Terasa", "Servis"],
    "Zdraví": ["Doktor", "Zubař", "Lékárna", "Vitamíny"],
    "Volný čas": ["Sport", "Klavír", "Výlety", "Dovolená"],
    "Ostatní": ["Elektronika", "Oblečení", "Dárky", "Investice (XTB)", "Jiné"]
  };
  const COLORS = ["#ff7a1a", "#ffa657", "#8e8e93", "#d4d4d8", "#c2410c", "#6b6b72", "#fb923c", "#3f3f46"];
  const COLOR_BY_CAT = {};
  Object.keys(CATEGORIES).forEach((c, i) => COLOR_BY_CAT[c] = COLORS[i % COLORS.length]);

  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwUWMPw8rI3W8TL2nxPD4ue4blpo5dwmTb_5Wjh-n7UGRWJqYrvqu-z2RUqIb-iR5gs/exec";

  const state = { account: "", category: "", subcategory: "" };
  let chart = null;

  const $ = id => document.getElementById(id);
  const fmt = n => Math.round(n).toLocaleString("cs-CZ") + " Kč";

  $("today").textContent = new Date().toLocaleDateString("cs-CZ", { day: "numeric", month: "long", year: "numeric" });

  // Výběr účtu
  document.querySelectorAll("#accounts button").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("#accounts button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      state.account = btn.dataset.acc;
    });
  });

  // Kategorie
  Object.keys(CATEGORIES).forEach(cat => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip";
    b.textContent = cat;
    b.addEventListener("click", () => {
      document.querySelectorAll("#categoryChips .chip").forEach(c => c.classList.remove("active"));
      b.classList.add("active");
      state.category = cat;
      state.subcategory = "";
      renderSubs(cat);
    });
    $("categoryChips").appendChild(b);
  });

  function renderSubs(cat) {
    const wrap = $("subChips");
    wrap.innerHTML = "";
    CATEGORIES[cat].forEach(sub => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      b.textContent = sub;
      b.addEventListener("click", () => {
        wrap.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
        b.classList.add("active");
        state.subcategory = sub;
      });
      wrap.appendChild(b);
    });
  }

  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2200);
  }

  // Odeslání výdaje
  const submitBtn = $("submitBtn");
  $("expenseForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!state.account) { toast("Vyber účet: Společný, Pavel nebo Gabi"); return; }
    if (!state.category || !state.subcategory) { toast("Vyber kategorii a podkategorii"); return; }
    const amount = $("amount").value;
    const pin = $("pinCode").value;
    if (!amount || !pin) { toast("Vyplň částku a PIN"); return; }

    submitBtn.disabled = true;
    submitBtn.textContent = "Odesílám…";

    const payload = {
      account: state.account,
      category: state.category,
      subcategory: state.subcategory,
      amount: amount,
      note: $("note").value,
      pin: pin,
      device: navigator.userAgent.slice(0, 200)
    };

    try {
      // no-cors: odpověď nelze přečíst, ověříme to přehledem níž
      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(payload)
      });
      toast("Výdaj odeslán");
      $("amount").value = "";
      $("note").value = "";
      $("pinCode").value = "";
      setTimeout(loadData, 2000);
    } catch (err) {
      toast("Chyba při odesílání");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Odeslat výdaj";
    }
  });

  // Načtení dat přes JSONP
  function loadData() {
    const name = "cb_" + Date.now();
    const script = document.createElement("script");
    const timer = setTimeout(fail, 10000);

    function cleanup() {
      clearTimeout(timer);
      delete window[name];
      script.remove();
    }
    function fail() {
      cleanup();
      $("monthTotal").textContent = "—";
      $("itemCount").textContent = "—";
      $("legend").innerHTML = '<div class="empty">Data se nepodařilo načíst</div>';
    }

    window[name] = rows => {
      cleanup();
      if (!Array.isArray(rows)) return fail();
      renderFromRows(rows);
    };
    script.onerror = fail;
    script.src = SCRIPT_URL + "?callback=" + name;
    document.body.appendChild(script);
  }

  // Datum z tabulky: Date, ISO text nebo český text "6.11.2026 13:33"
  function parseDate(v) {
    if (v instanceof Date) return v;
    if (typeof v === "string") {
      const m = v.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})(?:\s+(\d{1,2}):(\d{2}))?/);
      if (m) return new Date(+m[3], +m[2] - 1, +m[1], +(m[4] || 0), +(m[5] || 0));
    }
    return new Date(v);
  }

  // Sjednotí staré názvy účtů
  function normAccount(a) {
    if (!a) return "";
    const s = String(a);
    if (s.startsWith("Společ")) return "Společný";
    if (s.startsWith("Gab")) return "Gabi";
    return s;
  }

  function renderFromRows(rows) {
    const now = new Date();
    const totals = {};
    const counts = { "Společný": 0, "Pavel": 0, "Gabi": 0 };
    let sum = 0;
    let items = 0;
    rows.forEach(r => {
      const d = parseDate(r[0]);
      if (isNaN(d) || d.getMonth() !== now.getMonth() || d.getFullYear() !== now.getFullYear()) return;
      const amt = Number(r[1]) || 0;
      const cat = r[3] || "Ostatní";
      const acc = normAccount(r[2]);
      totals[cat] = (totals[cat] || 0) + amt;
      sum += amt;
      items++;
      // Automatické trvalé platby se do počítadla nezapočítávají
      const automatic = String(r[6] || "") === "Automaticky";
      if (!automatic && counts[acc] !== undefined) counts[acc]++;
    });
    $("itemCount").textContent = items;
    renderSummary(totals, sum);
    renderCounter(counts);
  }

  function renderCounter(counts) {
    $("counter").textContent =
      "Ruční platby tento měsíc: Společný " + counts["Společný"] +
      " · Pavel " + counts["Pavel"] +
      " · Gabi " + counts["Gabi"];
  }

  function renderSummary(totals, sum) {
    $("monthTotal").textContent = fmt(sum);
    const cats = Object.keys(totals).sort((a, b) => totals[b] - totals[a]);
    const values = cats.length ? cats.map(c => totals[c]) : [1];
    const colors = cats.length ? cats.map(c => COLOR_BY_CAT[c] || "#3f3f46") : ["#26262a"];
    const labels = cats.length ? cats : ["Zatím nic"];

    if (chart) {
      chart.data.labels = labels;
      chart.data.datasets[0].data = values;
      chart.data.datasets[0].backgroundColor = colors;
      chart.update();
    } else {
      chart = new Chart($("chart"), {
        type: "doughnut",
        data: { labels, datasets: [{ data: values, backgroundColor: colors, borderWidth: 0 }] },
        options: {
          cutout: "72%",
          maintainAspectRatio: false,
          plugins: { legend: { display: false }, tooltip: { enabled: cats.length > 0 } }
        }
      });
    }

    $("legend").innerHTML = cats.length
      ? cats.map(c => `
          <div class="legend-item">
            <span class="dot" style="background:${COLOR_BY_CAT[c] || "#3f3f46"}"></span>
            <span class="name">${c}</span>
            <span class="val">${fmt(totals[c])}</span>
          </div>`).join("")
      : '<div class="empty">Tento měsíc zatím žádné výdaje</div>';
  }

  loadData();
</script>
</body>
</html>
