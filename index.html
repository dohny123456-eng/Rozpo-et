<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Domácí rozpočet</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0d0e10;
    --surface: #14161a;
    --text: #ecebe6;
    --muted: #8a8a84;
    --faint: #5c5c57;
    --line: #23262c;
    --field: #101215;
    --accent: #9fd6b8;
    --accent-ink: #0d0e10;
    --serif: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 36px 20px 80px; }

  header { margin-bottom: 36px; }
  .eyebrow {
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint);
  }
  h1 {
    margin: 6px 0 4px; font-family: var(--serif); font-weight: 400;
    font-size: 30px; letter-spacing: -0.01em;
  }
  #today { margin: 0; color: var(--muted); font-size: 13px; }

  section { border-top: 1px solid var(--line); padding: 26px 0; }
  section:first-of-type { border-top: 0; padding-top: 0; }
  .sec-title {
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 16px;
  }

  /* Účet: textové záložky */
  .tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--line); }
  .tabs button {
    background: none; border: 0; padding: 0 0 12px; margin-bottom: -1px;
    font: inherit; color: var(--muted); cursor: pointer;
    border-bottom: 2px solid transparent; transition: color 0.15s;
  }
  .tabs button:hover { color: var(--text); }
  .tabs button.active { color: var(--text); border-bottom-color: var(--accent); }

  /* Chipy */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    background: transparent; border: 1px solid var(--line); color: var(--text);
    padding: 7px 13px; border-radius: 6px; font: inherit; font-size: 14px; cursor: pointer;
    transition: all 0.15s;
  }
  .chip:hover { border-color: var(--faint); }
  .chip.active { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .hint { color: var(--faint); font-size: 14px; }

  /* Částka */
  .amount-wrap { position: relative; border-bottom: 1px solid var(--line); }
  .amount-wrap input {
    background: transparent; border: 0; border-radius: 0; padding: 6px 40px 10px 0;
    font-family: var(--serif); font-size: 44px; color: var(--text);
  }
  .amount-wrap input:focus { box-shadow: none; }
  .amount-wrap::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px;
    background: var(--accent); transform: scaleX(0); transition: transform 0.25s;
  }
  .amount-wrap:focus-within::after { transform: scaleX(1); }
  .amount-wrap span {
    position: absolute; right: 0; top: 50%; transform: translateY(-60%);
    color: var(--muted); font-size: 16px; pointer-events: none;
  }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .field { margin-top: 22px; }
  .label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 8px; }

  input[type="text"], input[type="password"], input[type="number"] {
    width: 100%; padding: 11px 0; border: 0; border-bottom: 1px solid var(--line);
    background: transparent; color: var(--text); font: inherit; font-size: 15px;
    border-radius: 0; transition: border-color 0.15s;
  }
  input::placeholder { color: var(--faint); }
  input:focus { outline: none; border-bottom-color: var(--accent); }

  button.submit {
    width: 100%; margin-top: 30px; padding: 15px; border: 0; border-radius: 8px;
    background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 600;
    font-size: 15px; cursor: pointer; transition: opacity 0.15s;
  }
  button.submit:hover { opacity: 0.9; }
  button.submit:disabled { opacity: 0.5; cursor: default; }

  /* Přehled */
  .total-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 22px; }
  .total { font-family: var(--serif); font-size: 40px; margin: 0; letter-spacing: -0.01em; font-weight: 400; }
  .total-sub { color: var(--muted); font-size: 13px; }
  .chart-box { position: relative; height: 200px; margin-bottom: 22px; }
  .legend { display: grid; gap: 0; }
  .legend-item {
    display: flex; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px;
  }
  .legend-item:first-child { border-top: 0; }
  .legend-item .dot { width: 8px; height: 8px; border-radius: 2px; margin-right: 12px; flex-shrink: 0; }
  .legend-item .name { flex: 1; color: var(--text); }
  .legend-item .val { color: var(--text); font-variant-numeric: tabular-nums; }
  .empty { color: var(--faint); font-size: 14px; padding: 12px 0; }
  .counter { margin-top: 20px; text-align: right; color: var(--faint); font-size: 11px; line-height: 1.6; }

  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 120px);
    background: var(--text); color: var(--bg); padding: 11px 18px; border-radius: 8px;
    font-size: 14px; opacity: 0; transition: 0.3s; pointer-events: none;
  }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Rozpočet</div>
    <h1>Domácí rozpočet</h1>
    <p id="today"></p>
  </header>

  <form id="expenseForm">
    <section>
      <h2 class="sec-title">Nový výdaj</h2>

      <div class="tabs" id="accounts">
        <button type="button" data-acc="Společný">Společný</button>
        <button type="button" data-acc="Pavel">Pavel</button>
        <button type="button" data-acc="Gabi">Gabi</button>
      </div>

      <div class="field">
        <span class="label">Kategorie</span>
        <div class="chips" id="categoryChips"></div>
      </div>

      <div class="field">
        <span class="label">Podkategorie</span>
        <div class="chips" id="subChips"><span class="hint">Nejdřív vyber kategorii</span></div>
      </div>

      <div class="field">
        <span class="label">Částka</span>
        <div class="amount-wrap">
          <input type="number" id="amount" placeholder="0" required step="any" inputmode="decimal">
          <span>Kč</span>
        </div>
      </div>

      <div class="row field">
        <div>
          <span class="label">Poznámka</span>
          <input type="text" id="note" placeholder="Kaufland, nafta…">
        </div>
        <div>
          <span class="label">PIN</span>
          <input type="password" id="pinCode" placeholder="••••" required inputmode="numeric">
        </div>
      </div>

      <button type="submit" class="submit" id="submitBtn">Odeslat výdaj</button>
    </section>
  </form>

  <section>
    <h2 class="sec-title">Tento měsíc</h2>
    <div class="total-row">
      <p class="total" id="monthTotal">—</p>
      <span class="total-sub">celkem</span>
    </div>
    <div class="chart-box"><canvas id="chart"></canvas></div>
    <div class="legend" id="legend"></div>
    <div class="counter" id="counter"></div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
  const CATEGORIES = {
    "Jídlo": ["Obchod", "Restaurace", "Kavárna", "Hospoda", "Dovoz"],
    "Drogerie": ["Kosmetika", "Čištění", "Praní"],
    "Kočky": ["Krmivo", "Toaleta", "Veterina"],
    "Doprava": ["Palivo", "Servis", "Dálnice", "Pojištění", "Mytí"],
    "Domácnost": ["Rostliny", "Dekorace", "Nádobí", "Textílie", "Terasa", "Servis"],
    "Zdraví": ["Doktor", "Zubař", "Lékárna", "Vitamíny"],
    "Volný čas": ["Sport", "Klavír", "Výlety", "Dovolená"],
    "Ostatní": ["Elektronika", "Oblečení", "Dárky", "Investice (XTB)", "Jiné"]
  };
  const COLORS = ["#9fd6b8", "#e6b87d", "#8fb0d9", "#d98f8f", "#b8a3d9", "#d9cf8f", "#7fb5b0", "#c9c4b8"];
  const COLOR_BY_CAT = {};
  Object.keys(CATEGORIES).forEach((c, i) => COLOR_BY_CAT[c] = COLORS[i % COLORS.length]);

  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwUWMPw8rI3W8TL2nxPD4ue4blpo5dwmTb_5Wjh-n7UGRWJqYrvqu-z2RUqIb-iR5gs/exec";

  const state = { account: "", category: "", subcategory: "" };
  let chart = null;

  const $ = id => document.getElementById(id);
  const fmt = n => Math.round(n).toLocaleString("cs-CZ") + " Kč";

  $("today").textContent = new Date().toLocaleDateString("cs-CZ", { day: "numeric", month: "long", year: "numeric" });

  // Výběr účtu
  document.querySelectorAll("#accounts button").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("#accounts button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      state.account = btn.dataset.acc;
    });
  });

  // Kategorie
  Object.keys(CATEGORIES).forEach(cat => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip";
    b.textContent = cat;
    b.addEventListener("click", () => {
      document.querySelectorAll("#categoryChips .chip").forEach(c => c.classList.remove("active"));
      b.classList.add("active");
      state.category = cat;
      state.subcategory = "";
      renderSubs(cat);
    });
    $("categoryChips").appendChild(b);
  });

  function renderSubs(cat) {
    const wrap = $("subChips");
    wrap.innerHTML = "";
    CATEGORIES[cat].forEach(sub => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      b.textContent = sub;
      b.addEventListener("click", () => {
        wrap.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
        b.classList.add("active");
        state.subcategory = sub;
      });
      wrap.appendChild(b);
    });
  }

  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2200);
  }

  // Odeslání výdaje
  const submitBtn = $("submitBtn");
  $("expenseForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!state.account) { toast("Vyber účet: Společný, Pavel nebo Gabi"); return; }
    if (!state.category || !state.subcategory) { toast("Vyber kategorii a podkategorii"); return; }
    const amount = $("amount").value;
    const pin = $("pinCode").value;
    if (!amount || !pin) { toast("Vyplň částku a PIN"); return; }

    submitBtn.disabled = true;
    submitBtn.textContent = "Odesílám…";

    const payload = {
      account: state.account,
      category: state.category,
      subcategory: state.subcategory,
      amount: amount,
      note: $("note").value,
      pin: pin,
      device: navigator.userAgent.slice(0, 200)
    };

    try {
      // no-cors: odpověď nelze přečíst, ověříme to přehledem níž
      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(payload)
      });
      toast("Výdaj odeslán");
      $("amount").value = "";
      $("note").value = "";
      $("pinCode").value = "";
      setTimeout(loadData, 2000);
    } catch (err) {
      toast("Chyba při odesílání");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Odeslat výdaj";
    }
  });

  // Načtení dat přes JSONP
  function loadData() {
    const name = "cb_" + Date.now();
    const script = document.createElement("script");
    const timer = setTimeout(fail, 10000);

    function cleanup() {
      clearTimeout(timer);
      delete window[name];
      script.remove();
    }
    function fail() {
      cleanup();
      $("monthTotal").textContent = "—";
      $("legend").innerHTML = '<div class="empty">Data se nepodařilo načíst</div>';
    }

    window[name] = rows => {
      cleanup();
      if (!Array.isArray(rows)) return fail();
      renderFromRows(rows);
    };
    script.onerror = fail;
    script.src = SCRIPT_URL + "?callback=" + name;
    document.body.appendChild(script);
  }

  // Datum z tabulky: Date, ISO text nebo český text "6.11.2026 13:33"
  function parseDate(v) {
    if (v instanceof Date) return v;
    if (typeof v === "string") {
      const m = v.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})(?:\s+(\d{1,2}):(\d{2}))?/);
      if (m) return new Date(+m[3], +m[2] - 1, +m[1], +(m[4] || 0), +(m[5] || 0));
    }
    return new Date(v);
  }

  // Sjednotí staré názvy účtů
  function normAccount(a) {
    if (!a) return "";
    const s = String(a);
    if (s.startsWith("Společ")) return "Společný";
    if (s.startsWith("Gab")) return "Gabi";
    return s;
  }

  function renderFromRows(rows) {
    const now = new Date();
    const totals = {};
    const counts = { "Společný": 0, "Pavel": 0, "Gabi": 0 };
    let sum = 0;
    rows.forEach(r => {
      const d = parseDate(r[0]);
      if (isNaN(d) || d.getMonth() !== now.getMonth() || d.getFullYear() !== now.getFullYear()) return;
      const amt = Number(r[1]) || 0;
      const cat = r[3] || "Ostatní";
      const acc = normAccount(r[2]);
      totals[cat] = (totals[cat] || 0) + amt;
      sum += amt;
      // Automatické trvalé platby se do počítadla nezapočítávají
      const automatic = String(r[6] || "") === "Automaticky";
      if (!automatic && counts[acc] !== undefined) counts[acc]++;
    });
    renderSummary(totals, sum);
    renderCounter(counts);
  }

  function renderCounter(counts) {
    $("counter").textContent =
      "Ruční platby tento měsíc: Společný " + counts["Společný"] +
      " · Pavel " + counts["Pavel"] +
      " · Gabi " + counts["Gabi"];
  }

  function renderSummary(totals, sum) {
    $("monthTotal").textContent = fmt(sum);
    const cats = Object.keys(totals).sort((a, b) => totals[b] - totals[a]);
    const values = cats.length ? cats.map(c => totals[c]) : [1];
    const colors = cats.length ? cats.map(c => COLOR_BY_CAT[c] || "#5c5c57") : ["#23262c"];
    const labels = cats.length ? cats : ["Zatím nic"];

    if (chart) {
      chart.data.labels = labels;
      chart.data.datasets[0].data = values;
      chart.data.datasets[0].backgroundColor = colors;
      chart.update();
    } else {
      chart = new Chart($("chart"), {
        type: "doughnut",
        data: { labels, datasets: [{ data: values, backgroundColor: colors, borderWidth: 0 }] },
        options: {
          cutout: "78%",
          maintainAspectRatio: false,
          plugins: { legend: { display: false }, tooltip: { enabled: cats.length > 0 } }
        }
      });
    }

    $("legend").innerHTML = cats.length
      ? cats.map(c => `
          <div class="legend-item">
            <span class="dot" style="background:${COLOR_BY_CAT[c] || "#5c5c57"}"></span>
            <span class="name">${c}</span>
            <span class="val">${fmt(totals[c])}</span>
          </div>`).join("")
      : '<div class="empty">Tento měsíc zatím žádné výdaje</div>';
  }

  loadData();
</script>
</body>
</html>
